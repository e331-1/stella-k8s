---
# ======================================================
# Phase 1: Proxmox 上に LXC コンテナを作成する
# ======================================================
- name: Create Proxmox LXC Containers for Kubernetes
  hosts: proxmox
  gather_facts: false
  vars_files:
    - vars.yml

  tasks:
    - name: セキュリティグループの作成
      community.proxmox.proxmox_firewall:
        api_host: "{{ proxmox_api_host }}"
        api_user: "{{ proxmox_api_user }}"
        api_password: "{{ proxmox_api_password }}"
        group: "k8s-secgroup"
        group_conf: true
        comment: "k8s用セキュリティグループ（Ansible自動作成）"
        state: present
        validate_certs: no
      delegate_to: localhost
      run_once: true

    - name: セキュリティグループへのルール定義
      community.proxmox.proxmox_firewall:
        api_host: "{{ proxmox_api_host }}"
        api_user: "{{ proxmox_api_user }}"
        api_password: "{{ proxmox_api_password }}"
        group: "k8s-secgroup"
        level: "group"
        rules:
          - action: "REJECT"
            enable: true
            type: "out"
            dest: "192.168.0.0/24"
            comment: "ローカルへのアクセスを禁止"
            pos: 1
        state: present
        validate_certs: no
      delegate_to: localhost
      run_once: true
  
    - name: Create or Update LXC Containers
      community.proxmox.proxmox:
        api_host: "{{ proxmox_api_host }}"
        api_user: "{{ proxmox_api_user }}"
        api_password: "{{ proxmox_api_password }}"
        node: "{{ node_name }}"
        vmid: "{{ item.vmid }}"
        hostname: "{{ item.hostname }}"
        ostemplate: "{{ lxc_template }}"
        disk_volume:
          storage: "{{ storage_target }}"
          size: 20
        cores: 4
        memory: 4096
        swap: 4096
        cmode: shell
        validate_certs: no
        
        # --- K8s 用 LXC 設定 ---
        unprivileged: false
        features:
          - nesting=1
          - fuse=1
        
        # ネットワーク設定
        netif:
          net0: "name=eth0,bridge=vnetk8s,ip={{ item.ip }},gw={{ gateway_ip }},firewall=1"
        nameserver: "8.8.8.8" # DNSサーバー指定
        
        # SSH認証用の鍵を設定
        pubkey: "{{ ssh_public_key }}"
        state: present #これをつけると、LXCが存在しない場合は作成、存在する場合は更新される
      loop: "{{ containers }}"
      delegate_to: localhost
    
    - name: LXCコンテナにセキュリティグループを適用
      community.proxmox.proxmox_firewall:
        api_host: "{{ proxmox_api_host }}"
        api_user: "{{ proxmox_api_user }}"
        api_password: "{{ proxmox_api_password }}"
        node: "{{ node_name }}"
        vmid: "{{ item.vmid }}"
        level: "vm"
        validate_certs: no
        rules:
          - action: "k8s-secgroup"
            pos: 1
            enable: true
            iface : "net0"
            type: "group"
        state: present
      loop: "{{ containers }}"
      delegate_to: localhost
    
    - name: pveshで入力ポリシーをACCEPTに変更
      ansible.builtin.command:
        cmd: "pvesh set /nodes/{{ node_name }}/lxc/{{ item.vmid }}/firewall/options --policy_in ACCEPT"
      delegate_to: stella-01
      loop: "{{ containers }}"

    - name: コンテナ全体のファイアウォールを有効化
      ansible.builtin.command:
        cmd: "pvesh set /nodes/{{ node_name }}/lxc/{{ item.vmid }}/firewall/options --enable 1"
      delegate_to: stella-01
      loop: "{{ containers }}"

    - name: Ensure Proxmox LXC config file exists
      ansible.builtin.stat:
        path: "/etc/pve/lxc/{{ item.vmid }}.conf"   # 【修正】ハードコードをやめてループの vmid を使用
      register: conf_files
      delegate_to: stella-01
      loop: "{{ containers }}"

    - name: Proxmoxホスト側の設定ファイルにK3s用LXC設定を追記
      ansible.builtin.blockinfile:
        path: "/etc/pve/lxc/{{ item.item.vmid }}.conf" # 【修正】対応する vmid を指定
        marker: "# {mark} ANSIBLE MANAGED K3S CONFIG"
        block: |
          lxc.apparmor.profile: unconfined
          lxc.cap.drop:
          lxc.cgroup2.devices.allow: a
          lxc.mount.auto: proc:rw sys:rw
      delegate_to: "stella-01"
      loop: "{{ conf_files.results }}"
      when: item.stat.exists

    - name: Start LXC Containers
      community.proxmox.proxmox:
        api_host: "{{ proxmox_api_host }}"
        api_user: "{{ proxmox_api_user }}"
        api_password: "{{ proxmox_api_password }}"
        node: "{{ node_name }}"
        vmid: "{{ item.vmid }}"
        state: started
        validate_certs: no
      loop: "{{ containers }}"

    - name: Wait for SSH to be ready on containers
      ansible.builtin.wait_for:
        host: "{{ item.ip.split('/')[0] }}"
        port: 22
        timeout: 60
      loop: "{{ containers }}"

# ======================================================
# Phase 2: 作成した LXC に Kubernetes (k3s) をインストールする
# ======================================================
- name: Install Kubernetes (k3s) on LXC Nodes
  hosts: k8s_nodes
  gather_facts: true
  vars_files:
    - vars.yml

  tasks:
    - name: Ensure required packages and modules are loaded
      ansible.builtin.apt:
        name: [curl, ca-certificates]
        state: present
        update_cache: yes
    - name: .bashrcに環境変数を追加
      ansible.builtin.lineinfile:
        path: ~/.bash_profile
        line: 'export KUBE_EDITOR="nano"'
        regexp: '^export KUBE_EDITOR='
        create: yes
        mode: '0644'
    - name: K3s設定ディレクトリの作成
      ansible.builtin.file:
        path: /etc/rancher/k3s
        state: directory
        mode: '0755'
 
    - name: K3s config.yamlの配置
      ansible.builtin.copy:
        dest: /etc/rancher/k3s/config.yaml
        content: |
          kube-proxy-arg:
            - "conntrack-max-per-core=0"
          kube-apiserver-arg:
            - "oidc-issuer-url={{ oidc_issuer_url }}"
            - "oidc-client-id={{ oidc_client_id }}"
            - "oidc-username-claim=email"  # または sub など
            - "oidc-username-prefix=-"
          disable:
            - servicelb
  
    - name: Ensure /dev/kmsg symlink exists
      ansible.builtin.file:
        src: /dev/console
        dest: /dev/kmsg
        state: link
        force: no  # すでに存在していれば何もしない

    - name: Persist /dev/kmsg symlink via systemd-tmpfiles
      ansible.builtin.copy:
        dest: /etc/tmpfiles.d/kmsg.conf
        content: "L /dev/kmsg - - - - /dev/console\n"
        mode: '0644'
    
    - name: Install K3s (Master node)
      ansible.builtin.shell: |
        curl -sfL https://get.k3s.io | sh -s - --disable traefik --disable servicelb
      when: 
        - inventory_hostname == "master"
        - not ansible_check_mode
      args:
        creates: /usr/local/bin/k3s  # 【重要】k3sバイナリがすでにあればスキップする（冪等性担保）
      register: k3s_install
    
    
    - name: Ensure K3s Node Token
      ansible.builtin.stat:
        path: "/var/lib/rancher/k3s/server/node-token"   # 【修正】ハードコードをやめてループの vmid を使用
      delegate_to: master

    - name: Get K3s Node Token
      ansible.builtin.command: cat /var/lib/rancher/k3s/server/node-token
      when: inventory_hostname == "master"
      register: k3s_token
      changed_when: false

    - name: Set token fact for worker nodes
      ansible.builtin.set_fact:
        master_token: "{{ hostvars['master']['k3s_token']['stdout'] }}"
      when: inventory_hostname != "master"
    

    - name: Join K3s Worker nodes
      ansible.builtin.shell: |
        curl -sfL https://get.k3s.io | K3S_URL=https://10.0.1.3:6443 K3S_TOKEN={{ master_token }} sh -s - --disable traefik --disable servicelb
      when: 
        - inventory_hostname != "master"
        - not ansible_check_mode
      args:
        creates: /usr/local/bin/k3s  # 【重要】k3sバイナリがすでにあればスキップする（冪等性担保）

    - name: Ensure required packages and modules are loaded
      ansible.builtin.apt:
        name: 
          - curl
          - ca-certificates
          - python3-kubernetes # ← これを追加
          - python3-yaml       # ← これを追加
        state: present
        update_cache: yes
    - name: ArgoCD 用の namespace を作成
      kubernetes.core.k8s:
        kubeconfig: /etc/rancher/k3s/k3s.yaml
        name: argocd
        api_version: v1
        kind: Namespace
        state: present
      become: true
      when: inventory_hostname == "master"

    - name: ArgoCD 本体を公式 Manifest からインストール
      kubernetes.core.k8s:
        kubeconfig: /etc/rancher/k3s/k3s.yaml
        namespace: argocd
        state: present
        # 公式の標準 install.yaml を直接適用
        src: https://raw.githubusercontent.com/argoproj/argo-cd/stable/manifests/install.yaml
      become: true
      when: inventory_hostname == "master"

    - name: ArgoCD にstella-k8sのレポジトリを登録し、root-appを作成
      kubernetes.core.k8s:
        kubeconfig: /etc/rancher/k3s/k3s.yaml
        namespace: argocd
        state: present
        definition:
          apiVersion: argoproj.io/v1alpha1
          kind: Application
          metadata:
            name: root-app
            namespace: argocd
          spec:
            project: default
            source:
              repoURL: 'https://github.com/e331-1/stella-k8s.git'
              targetRevision: HEAD
              path: apps # apps/ 配下の全ファイルを再帰的に読み込む
              # directory:
              #   recurse: true
            destination:
              server: 'https://kubernetes.default.svc'
              namespace: argocd
            syncPolicy:
              automated:
                prune: true
                selfHeal: true
      become: true
      when: inventory_hostname == "master"
    
    - name: cert-manager-config 用の Argo CD Application を作成・更新
      kubernetes.core.k8s:
        kubeconfig: /etc/rancher/k3s/k3s.yaml
        namespace: argocd
        state: present
        # lookup('template', ...) を使って Jinja2 を展開した結果を投入
        definition: "{{ lookup('template', 'templates/cert-manager-config.yaml.j2') }}"
      become: true
      when: inventory_hostname == "master"
