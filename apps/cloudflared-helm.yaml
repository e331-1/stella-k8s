# capsule-helm/Application.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cloudflared
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://cloudflare.github.io/helm-charts'
    chart: cloudflare-tunnel
    targetRevision: 0.3.2
    helm:
      values: |
        # 事前に作成したSecretを参照
        secret:
          name: cloudflare-tunnel-secret
          key: api-token
        # トンネルルーティング（Ingress Rules）設定
        config:
          ingress:
            - hostname: "pitpe.app"
              service: https://my-service.my-namespace.svc.cluster.local:443
            - hostname: "*.pitpe.app"
              service: https://my-service.my-namespace.svc.cluster.local:443
            - service: http_status:404
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: cloudflare-tunnel
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true