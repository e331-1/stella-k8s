apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name:  capsule-proxy-helm
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: 'https://projectcapsule.github.io/charts'
    chart: capsule-proxy
    targetRevision: 0.13.*
    helm:
      values: |
        # cert-manager を使用して証明書を自動作成する場合
        certManager:
          generateCertificates: true
        # Node や StorageClass などのプロキシ機能（フィルター）をすべて有効化
        options:
          enableAllOption: true
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: capsule-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true