# capsule-helm/Application.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vault
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://helm.releases.hashicorp.com'
    chart: vault
    targetRevision: 0.34.1
    helm:
      values: |
        server:
          # HA を無効化
          ha:
            enabled: false
          
          # 単一 Pod 構成（スタンドアロン）を有効化
          standalone:
            enabled: true

          # レプリカ数を 1 に設定（デフォルト 1 ですが明示）
          replicas: 1
          # Proxmox CSIを利用した永続ボリューム（PVC）の設定
          dataStorage:
            enabled: true
            size: 10Gi
            # ここにご自身のProxmox CSIのStorageClass名を指定します
            storageClass: "proxmox-local-lvm"
            accessMode: ReadWriteOnce

        # Web UIを有効化
        ui:
          enabled: true
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: vault
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true