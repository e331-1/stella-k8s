# capsule-helm/Application.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cilium-helm
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    repoURL: 'quay.io/cilium/charts'
    chart: cilium

    #https://github.com/envoyproxy/gateway/releases
    #最新バージョンはここからチェック
    targetRevision: 1.20.*
    helm:
      # Argo CD 側で Helm リリース名を明示したい場合は releaseName を指定できます
      releaseName: cilium 
      valuesObject:
        # 1. 基本・kube-proxy 置き換え設定
        kubeProxyReplacement: true
        # ※ RKE2 と異なり、Talos のコントロールプレーン IP (例: 10.0.1.2) を指定します
        k8sServiceHost: "10.0.1.2"
        k8sServicePort: 6443

        # 2. DSR (Direct Server Return) モード設定
        loadBalancer:
          mode: "dsr"
          dsrDispatch: "geneve"

        # 3. トンネルプロトコルの指定
        tunnelProtocol: "geneve"

        # 4. L2 Announcement & Gateway API (前回からの統合)
        l2announcements:
          enabled: true
        gatewayAPI:
          enabled: true
        socketLB:
          enabled: true

        # 5. シングルノード / 8GBメモリ用の省資源化設定
        operator:
          replicas: 1
        ipam:
          mode: "kubernetes"
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
