apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: node-feature-discovery
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    # 1. oci:// プレフィックスを付ける
    repoURL: 'oci://registry.k8s.io/nfd/charts'
    chart: node-feature-discovery
    # 2. バージョン頭に 'v' を付ける (ログに出ていた v0.17.1 などを指定)
    targetRevision: v0.17.1
    helm:
      values: |
        # 前回問題になっていた worker 起動のフラグも合わせて設定
        worker:
          enable: true
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: node-feature-discovery
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true