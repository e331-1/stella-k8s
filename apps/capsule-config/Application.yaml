apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: capsule-config
  namespace: argocd
  annotations:
    # 本体（CRD）の適用完了後に実行するため wave 1 を指定
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: 'https://github.com/e331-1/stella-k8s.git'
    targetRevision: HEAD
    path: apps/capsule-config # config.yaml が置いてあるパス
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: capsule-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true