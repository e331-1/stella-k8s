apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: envoy-dedicated-pool
  namespace: metallb-system
spec:
  addresses:
  - 192.168.0.200/32
  autoAssign: false  # 他の一般的なServiceへ自動で配らないようにする
---
apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: general-pool
  namespace: metallb-system
spec:
  addresses:
  - 192.168.0.201-192.168.0.250
  autoAssign: true
---
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: default
  namespace: metallb-system
spec:
  ipAddressPools:
  - default