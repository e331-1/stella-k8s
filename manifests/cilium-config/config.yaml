apiVersion: "cilium.io/v2"
kind: CiliumLoadBalancerIPPool
metadata:
  name: lan-pool
  namespace: kube-system
spec:
  blocks:
    # 例: 192.168.0.200 〜 192.168.0.254 を LoadBalancer 用に解放
    - start: "192.168.0.200"
      stop: "192.168.0.254"
---
apiVersion: "cilium.io/v2alpha1"
kind: CiliumL2AnnouncementPolicy
metadata:
  name: l2-policy
  namespace: kube-system
spec:
  # L2 応答を返すネットワークインターフェース（例: eth0）
  # 空指定や eth0 の指定でノードのメインNICからARP応答を返します
  interfaces:
    - "ens19"
  externalIPs: true
  loadBalancerIPs: true
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: cilium-gateway
  namespace: default
spec:
  gatewayClassName: cilium
  addresses:
    - type: IPAddress
      value: "192.168.0.200"
  listeners:
    - name: https-wildcard
      protocol: HTTPS
      port: 443
      hostname: "*.pitpe.app"
      tls:
        mode: Terminate
        certificateRefs:
        - name: pitpe-app-tls # Certificate が生成した Secret 名を指定
      allowedRoutes:
        namespaces:
          from: All
    - name: https-apex
      protocol: HTTPS
      port: 443
      hostname: "pitpe.app"
      tls:
        mode: Terminate
        certificateRefs:
        - name: pitpe-app-tls # Certificate が生成した Secret 名を指定
      allowedRoutes:
        namespaces:
          from: All