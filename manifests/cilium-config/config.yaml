apiVersion: "cilium.io/v2alpha1"
kind: CiliumLoadBalancerIPPool
metadata:
  name: "first-pool"
spec:
  blocks:
    - start: "192.168.0.200"
      stop: "192.168.0.250"
---
apiVersion: "cilium.io/v2alpha1"
kind: CiliumL2AnnouncementPolicy
metadata:
  name: "l2-policy"
spec:
  # LoadBalancer タイプの Service 全体に対して有効化
  serviceSelector:
    matchExpressions:
      - key: "color" # 任意のラベル指定、空（指定なし）ならすべての Service に適用
        operator: "DoesNotExist"
  nodeSelector:
    matchExpressions:
      - key: "kubernetes.io/hostname"
        operator: "Exists"
  interfaces:
    - "eth0" # パケットを応答させる NIC
  externalIPs: true
  loadBalancerIPs: true
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: gateway
  namespace: default
spec:
  gatewayClassName: cilium
  listeners:
    - name: https
      protocol: HTTPS
      port: 443
      hostname: "*.pitpe.app"
      tls:
        mode: Terminate
        certificateRefs:
        - name: pitpe-app-tls # Certificate が生成した Secret 名を指定
    - name: https
      protocol: HTTPS
      port: 443
      hostname: "pitpe.app"
      tls:
        mode: Terminate
        certificateRefs:
        - name: pitpe-app-tls # Certificate が生成した Secret 名を指定