apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: eg
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: eg
  namespace: envoy-gateway-system
spec:
  gatewayClassName: eg
  infrastructure:
    parametersRef:
      group: gateway.envoyproxy.io
      kind: EnvoyProxy
      name: proxy-config
  # addresses:
  # - type: IPAddress
  #   value: 192.168.0.200 # Envoyに割り当てたい固定IP
  listeners:
  - name: https
    protocol: HTTPS
    port: 443
    hostname: "*.pitpe.app"
    tls:
      mode: Terminate
      certificateRefs:
      - name: pitpe-app-tls # Certificate が生成した Secret 名を指定
  - name: https
    protocol: HTTPS
    port: 443
    hostname: "pitpe.app"
    tls:
      mode: Terminate
      certificateRefs:
      - name: pitpe-app-tls # Certificate が生成した Secret 名を指定