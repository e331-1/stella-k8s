# capsule-config/config.yaml
apiVersion: capsule.clastix.io/v1beta2
kind: CapsuleConfiguration
metadata:
  name: default
spec:
  cacheInvalidation: 0h30m0s
  enableTLSReconciler: false
  rbac:
    enabled: true
  # users:
  #   - kind: Group
  #     name: system:authenticated
  userGroups:
      - capsule.clastix.io
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: capsule-proxy
  namespace: capsule-system
spec:
  parentRefs:
  - name: cilium-gateway
    namespace: default
  hostnames:
  - "kubernetes.pitpe.app" # 利用するホスト名またはドメイン名に変更してください
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: capsule-proxy
      port: 9001