apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: vault-backend
spec:
  provider:
    vault:
      server: "http://vault.vault.svc.cluster.local:8200" # Vault の Service URL
      path: "secret" # KV v2 エンジンのマウントパス
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "eso-role" # Vault で作成したロール名
          secretRef:
            name: "eso-serviceaccount-token" # K8s SA トークンを参照（自動生成または自作）
            key: "token"
            namespace: "external-secrets"
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: cloudflare-token-sync
  namespace: cert-manager # cert-manager が参照する namespace
spec:
  refreshInterval: "1h" # Vault からの自動同期インターバル
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: cloudflare-api-token-secret # 作成される Kubernetes Secret 名
    creationPolicy: Owner
  data:
    - secretKey: api-token # K8s Secret 内の Key 名 (.data.api-token)
      remoteRef:
        key: cloudflare    # Vault のパス (secret/data/cloudflare)
        property: api-token # Vault 内の JSON パラメータ名