apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root-app # 1つのApplicationで一括管理
  namespace: argocd
spec:
  project: default
  # ▼ 1つのApplication内にソースを複数定義
  sources:
    - repoURL: 'https://github.com/your-org/your-repo.git'
      targetRevision: main
      path: argocd/apps/base/manifests

    - repoURL: 'https://github.com/your-org/your-repo.git'
      targetRevision: main
      path: argocd/apps/overlays/production

  destination:
    server: 'https://kubernetes.default.svc'
    namespace: default