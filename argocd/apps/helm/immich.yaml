apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: immich
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'ghcr.io/immich-app/immich-charts'
    chart: immich
    targetRevision: 0.13.1 # お使いのチャートバージョン
    helm:
      valuesObject: 
        valkey:
          enabled: true
        controllers:
          main:
            containers:
              main:
                image:
                  tag: v3.0.0
                env:
                  LIBVA_DRIVER_NAME: "iHD"
                  DB_HOSTNAME:
                    valueFrom:
                      secretKeyRef:
                        name: immich-database-app
                        key: host
                  DB_USERNAME: 
                    valueFrom:
                      secretKeyRef:
                        name: immich-database-app
                        key: username
                  DB_DATABASE_NAME:
                    valueFrom:
                      secretKeyRef:
                        name: immich-database-app
                        key: dbname
                  DB_PASSWORD:
                    valueFrom:
                      secretKeyRef:
                        name: immich-database-app
                        key: password
                # 修正ポイント: resources をここに記述します
                resources:
                  limits:
                    gpu.intel.com/i915: "1"
                  requests:
                    gpu.intel.com/i915: "1"

        immich:
          persistence:
            library:
              existingClaim: "immich-data-pvc"
        machine-learning:
          enabled: true
          persistence:
            cache:
              enabled: true
              type: emptyDir



  destination:
    server: 'https://kubernetes.default.svc'
    namespace: immich
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true